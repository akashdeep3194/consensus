[project]
name = "consensus"
version = "0.1.0"
description = "Project Consensus 3D — deterministic social prediction game"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "itsdangerous>=2.2",
]
# NOTE: engine/ and domain/ must remain importable with stdlib only.
# tools/check_layering.py enforces that in CI.

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "httpx2>=0.28", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "domain", "ports", "adapters", "services", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # our own code must never warn
  "error",
  # third-party deprecations we do not control
  "ignore::DeprecationWarning:anyio.*",
  "ignore::DeprecationWarning:starlette.*",
  "ignore:Using `httpx` with `starlette.testclient`:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# analysis/ holds exploratory simulation scripts written to be read in a
# terminal, not production code. Real errors still apply; style rules do not.
"scripts/*" = ["E501"]
"analysis/*" = ["E4", "E7", "E70", "I001", "B905", "SIM", "F811", "F541", "E402"]
