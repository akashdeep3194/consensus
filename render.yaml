services:
  - type: web
    name: consensus-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: consensus-db
          property: connectionString
      - key: DEV_LOGIN
        value: "0"

databases:
  - name: consensus-db
    databaseName: consensus
    plan: free