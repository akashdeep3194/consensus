name: Round scheduler sweep (safety net)

# The primary scheduler is services.run_scheduler — a background asyncio
# loop, started from api.main's lifespan, that sleeps exactly until the next
# round boundary and sweeps then, rather than polling. That loop is
# event-driven and lives inside the app process itself; this workflow exists
# only for the case that process is down or wedged (a crash, a bad deploy, a
# Render cold-start) and nothing is sweeping at all. Five minutes of drift
# from *this* backstop is fine — it only ever matters when the real
# scheduler already isn't running.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # manual "run now" from the Actions tab, for testing

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/admin/advance
        run: |
          code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -X POST "https://consensus-api.onrender.com/api/admin/advance" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}")
          cat /tmp/body.json
          echo
          if [ "$code" -ge 300 ]; then
            echo "::error::sweep failed with HTTP $code"
            exit 1
          fi
